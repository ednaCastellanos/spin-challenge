apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: spin-transactions
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: spin-transactions
  minReplicas: 3
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 65 }
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300