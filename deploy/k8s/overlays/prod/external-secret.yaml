apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: spin-transactions-secrets
  namespace: spin
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: ClusterSecretStore
  target:
    name: spin-transactions-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: spin/transactions/prod